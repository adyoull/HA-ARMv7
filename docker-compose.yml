services:
  homeassistant:
    image: ha-armv7:latest
    container_name: homeassistant
    restart: unless-stopped
    # host networking is required for discovery (mDNS, SSDP, HomeKit, Matter...)
    network_mode: host
    privileged: true
    volumes:
      - ./config:/config
      - /run/dbus:/run/dbus:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Europe/London
    # Protocol-agnostic healthcheck: tries HTTPS (for SSL/DuckDNS setups) then
    # HTTP. Overrides the image default; takes effect on `docker compose up -d`
    # without rebuilding. -k because 127.0.0.1 won't match the cert name.
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -fsSk https://127.0.0.1:8123/manifest.json || curl -fsS http://127.0.0.1:8123/manifest.json || exit 1"
      interval: 60s
      timeout: 10s
      start_period: 20m
      retries: 3
    # Uncomment for Zigbee/Z-Wave USB sticks:
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0
